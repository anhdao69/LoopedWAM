[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "loopedwam"
version = "1.0.0"
description = "LoopedWAM: Looped World Action Models for Elastic Inference"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
  "av==15.1.0",
  "einops==0.8.1",
  "huggingface-hub>=0.34,<1.0",
  "numpy==2.2.6",
  "pillow==12.0.0",
  "pyarrow==24.0.0",
  "pyyaml==6.0.3",
  "regex==2025.11.3",
  "safetensors==0.5.3",
  "torch==2.7.1",
  "torchvision==0.22.1",
  "tqdm==4.68.3",
  "transformers==4.49.0",
]

[project.optional-dependencies]
libero = [
  "bddl==1.0.1",
  "easydict==1.9",
  "gym==0.25.2",
  "imageio==2.37.0",
  "imageio-ffmpeg",
  "mujoco==3.3.2",
  "robosuite==1.4.0",
]
robocasa_gr1 = [
  "msgpack==1.2.3",
  "websockets==16.0",
]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
include = ["loopedwam*"]
