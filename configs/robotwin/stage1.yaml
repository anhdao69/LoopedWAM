# LoopedWAM on RoboTwin 2.0, stage 1 of 2: 5 epochs from the Wan2.1 donor, peak learning rate 1e-4, 5% warmup.
data: data/prepared/robotwin
vae: checkpoints/Wan2.1-T2V-1.3B/Wan2.1_VAE.pth
wan: checkpoints/Wan2.1-T2V-1.3B
output: runs/robotwin/stage1

plan: random
start_epoch: 0
end_epoch: 5
global_batch: 128
microbatch: 8          # windows per GPU per forward pass (memory only)
lr: 1.0e-4
warmup_fraction: 0.05
weight_decay: 0.01
seed: 42

checkpoint_every: 1000
checkpoint_blocks: false
compile: false
