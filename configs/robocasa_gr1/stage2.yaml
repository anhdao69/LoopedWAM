# LoopedWAM on RoboCasa-GR1, stage 2 of 2: epochs 6-10, continuing stage 1 with its optimizer state, peak learning
# rate 3e-5, no warmup. The released LoopedWAM, and the teacher of LoopedWAM-E, is epoch_09.pt.
data: data/prepared/robocasa_gr1
vae: checkpoints/Wan2.1-T2V-1.3B/Wan2.1_VAE.pth
init: runs/robocasa_gr1/stage1/latest.pt
resume_optimizer: true
output: runs/robocasa_gr1/stage2

plan: random
start_epoch: 5
end_epoch: 10
global_batch: 256
microbatch: 16         # windows per GPU per forward pass (memory only)
lr: 3.0e-5
warmup_fraction: 0.0
weight_decay: 0.01
seed: 42
save_epochs: [6, 7, 8, 9, 10]

checkpoint_every: 1000
checkpoint_blocks: false
compile: false
